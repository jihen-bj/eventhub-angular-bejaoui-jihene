<section>
  <div class="page-head">
    <div>
      <h1>Catalogue d'événements</h1>
      <p class="subtitle">Ateliers, conférences, rencontres et compétitions de l'association.</p>
    </div>
    <div class="fav-counter">
      ★ Favoris : <strong>{{ favoritesCount() }}</strong>
    </div>
  </div>

  <div class="filters">
    <div class="chips" role="group" aria-label="Filtre par catégorie">
      @for (category of categories(); track category) {
        <button
          type="button"
          class="chip"
          [class.active]="selectedCategory() === category"
          (click)="selectCategory(category)"
        >
          {{ category }}
        </button>
      }
    </div>

    <button
      type="button"
      class="chip fav-filter"
      [class.active]="favoritesOnly()"
      (click)="toggleFavoritesOnly()"
    >
      ★ Mes favoris uniquement
    </button>
  </div>

  <div class="grid">
    @for (event of filteredEvents(); track event.id) {
      <app-event-card
        [event]="event"
        [isFavorite]="isFavorite(event.id)"
        (favoriteToggled)="toggleFavorite($event)"
      />
    } @empty {
      <p class="empty">Aucun événement disponible</p>
    }
  </div>
</section>
